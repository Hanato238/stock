# stock
# 共通部分（ports・seccomp・claude-home・共通プラグイン・CLAUDE.md・hook・agy 設定・共通 env・Orca/SSH）は
# ../../container/base.yml にある。ここは stock 固有の差分だけ。
# packages/claude-env を COPY するので build の context はリポジトリ直下（..）。

name: stock

services:
  node:
    extends:
      file: ../../container/base.yml
      service: node
    container_name: stock
    build:
      context: ..
      dockerfile_inline: |
        ARG BASE_IMAGE
        FROM $${BASE_IMAGE}
        USER root

        # gws (Google Workspace CLI)
        RUN npm install -g @googleworkspace/cli

        # Google Cloud SDK (gcloud)
        RUN echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" \
              > /etc/apt/sources.list.d/google-cloud-sdk.list \
            && curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
              | gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg \
            && apt-get update \
            && apt-get install -y --no-install-recommends google-cloud-cli \
            && rm -rf /var/lib/apt/lists/*

        # markitdown (uv tool) - IR PDF を Markdown に変換してローカルで直接解析するため
        RUN UV_TOOL_DIR=/opt/uv-tools UV_TOOL_BIN_DIR=/usr/local/bin uv tool install "markitdown[pdf]"

        # claude-env: ローカルパッケージを COPY して install + setup
        COPY packages/claude-env /tmp/claude-env
        RUN npm install -g /tmp/claude-env \
            && claude-env install \
            && HOME=/home/node claude-env setup \
            && chown -R node:node /home/node \
            && rm -rf /tmp/claude-env

        USER node
    volumes:
      - ..:/workspace:cached
      - .:/workspace/.devcontainer:ro
      - ../.mcp.json:/workspace/.mcp.json:ro
      - ./managed-settings.json:/etc/claude-code/managed-settings.json:ro
    environment:
      - GITHUB_MCP_PAT=${GITHUB_MCP_PAT_STOCK}

# extends ではトップレベルの volumes が継承されないため必須。
volumes:
  claude-home:
