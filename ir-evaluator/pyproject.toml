[project]
name = "ir-evaluator"
version = "0.1.0"
description = "企業IR投資適格性評価システム"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "markitdown[pdf]>=0.1.0",
    "google-genai>=2.19.0",
    "pypdfium2>=5.13.0",
]

[project.scripts]
evaluate = "ir_evaluator.cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]
